<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2e9" />
    <meta name="description" content="A mobile-friendly reader for system design interview notes." />
    <title>System Design Field Notes</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">Skip to notes</a>

    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" aria-label="Open chapters" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#/chapter/2/part/1" aria-label="System Design Field Notes home">
        <span class="brand-mark">SD</span>
        <span><strong>Field Notes</strong><small>Interview handbook</small></span>
      </a>
      <button class="icon-button theme-button" id="themeButton" aria-label="Switch color theme">◐</button>
    </header>

    <div class="app-shell">
      <div class="scrim" id="scrim" hidden></div>
      <aside class="sidebar" id="sidebar" aria-label="Chapters">
        <div class="sidebar-heading">
          <p>Study guide</p>
          <span id="chapterCount">20 chapters</span>
        </div>
        <nav id="chapterNav"></nav>
        <div class="sidebar-note">
          <span>Quick tip</span>
          Use each cheat sheet for a fast review before an interview.
        </div>
      </aside>

      <main class="reader" id="reader" tabindex="-1">
        <div class="reading-header">
          <div>
            <p class="eyebrow" id="eyebrow">Chapter 2 · Part 1</p>
            <h1 id="pageTitle">Caching</h1>
          </div>
          <a class="cheat-link" id="cheatLink" href="#/chapter/2/cheat-sheet">⚡ Cheat sheet</a>
        </div>

        <div class="reading-progress" aria-hidden="true"><span id="progressBar"></span></div>
        <article class="markdown-body" id="content" aria-live="polite">
          <div class="loading">Opening your notes…</div>
        </article>

        <nav class="page-nav" aria-label="Page navigation">
          <a id="previousLink" class="page-link previous" href="#"><small>Previous</small><span></span></a>
          <a id="nextLink" class="page-link next" href="#"><small>Next</small><span></span></a>
        </nav>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
